[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-solutions"
version = "0.1.0"
description = "A collaborative, tested collection of LeetCode solutions in Python and SQL."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Hamid Jahani", email = "hamidjahani999@gmail.com" }]
keywords = ["leetcode", "algorithms", "data-structures", "sql", "interview-preparation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/sheperd007/LeetCode"
Repository = "https://github.com/sheperd007/LeetCode"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
